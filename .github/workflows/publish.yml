name: .NET Build & Publish

on:
  workflow_dispatch: 

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/Egov.Integrations.MNotify/Egov.Integrations.MNotify.csproj'
  EXTENDED_PROJECT_PATH: 'src/Egov.Integrations.MNotify.Extended/Egov.Integrations.MNotify.Extended.csproj'
  SOLUTION_PATH: 'src/Egov.Integrations.MNotify.sln'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

  publish:
    name: Publish NuGet
    needs: build
    # Run on: manual trigger OR pushes to master OR version tags
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.ref == 'refs/heads/master' || 
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read # No longer need write since we aren't pushing back
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set Version
        id: versioning
        shell: bash
        run: |
          # Both packages are versioned together as 10.0.<run_number>.
          echo "NEW_VERSION=10.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --output ./nupkg /p:Version=${{ steps.versioning.outputs.NEW_VERSION }}
          dotnet pack ${{ env.EXTENDED_PROJECT_PATH }} --configuration Release --output ./nupkg /p:Version=${{ steps.versioning.outputs.NEW_VERSION }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ github.token }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push ./nupkg/*.nupkg --api-key ${{ github.token }} --source github --skip-duplicate
